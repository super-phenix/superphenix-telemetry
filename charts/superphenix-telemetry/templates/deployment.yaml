apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "superphenix-telemetry.fullname" . }}
  labels:
    {{- include "superphenix-telemetry.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "superphenix-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "superphenix-telemetry.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "superphenix-telemetry.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.config.listenAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ANONYMIZER_SALT
              value: {{ .Values.config.anonymizerSalt | quote }}
            - name: RATE_LIMIT_MAX
              value: {{ .Values.config.rateLimit.max | quote }}
            - name: RATE_LIMIT_WINDOW
              value: {{ .Values.config.rateLimit.window | quote }}
            - name: TRUST_FORWARDED_FOR
              value: {{ .Values.config.trustForwardedFor | quote }}
            - name: READ_HEADER_TIMEOUT
              value: {{ .Values.config.timeouts.readHeader | quote }}
            - name: WRITE_TIMEOUT
              value: {{ .Values.config.timeouts.write | quote }}
            - name: IDLE_TIMEOUT
              value: {{ .Values.config.timeouts.idle | quote }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.config.timeouts.shutdown | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
